<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --top:#2a8fb5; --bottom:#0e4a6b; --page:#08334d;
  --glass:rgba(6,22,40,.62); --text:#EAF8FF; --muted:#B9DCEB;
  --glow:#FFE8A3; --jelly:#B79CFF; --coral:#FF7A8A;
  --display:'Syne','Trebuchet MS',system-ui,sans-serif;
  --body:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--top:#0a2540;--bottom:#020a14;--page:#030d18}
}
:root[data-theme="dark"]{--top:#0a2540;--bottom:#020a14;--page:#030d18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;min-height:100dvh;overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:var(--page);color:var(--text);font-family:var(--body);font-weight:300;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px}
button{font:inherit}
:focus-visible{outline:3px solid var(--glow);outline-offset:3px}

.stage{position:relative;width:100%;max-width:980px;height:min(72vh,620px);min-height:380px;border-radius:30px;overflow:hidden;
  background:linear-gradient(180deg,var(--top),var(--bottom));
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px -20px rgba(0,0,0,.6);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}
.pill{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:8px 18px;font-weight:400;font-size:1rem}
.pill b{font-family:var(--display);font-weight:800;font-size:1.25rem;margin-left:6px;color:var(--glow)}

.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(2,10,20,.35);transition:opacity .4s}
.veil[hidden]{display:none}
.card{max-width:420px;text-align:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:28px;padding:34px 30px 30px;box-shadow:0 0 60px rgba(183,156,255,.25)}
.card h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,9vw,4rem);line-height:1;margin:0 0 12px;letter-spacing:-.02em;color:var(--text)}
.card p{margin:0 0 24px;color:var(--muted);font-size:1.1rem;line-height:1.55}
.name{display:block;width:100%;max-width:260px;margin:0 auto 16px;padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:var(--text);font:inherit;font-size:16px;text-align:center}
.name::placeholder{color:var(--muted);opacity:.8}
.go{border:0;border-radius:999px;padding:14px 30px;font-weight:500;font-size:1.1rem;color:#1b1040;
  background:linear-gradient(135deg,var(--glow),#ffc7a3);box-shadow:0 0 28px rgba(255,232,163,.45);cursor:pointer;transition:transform .15s,box-shadow .15s}
.go:hover{transform:scale(1.04);box-shadow:0 0 40px rgba(255,232,163,.7)}
.hint{margin:0;color:var(--muted);font-size:.95rem;text-align:center}
@media (prefers-reduced-motion:reduce){.go,.veil{transition:none}.go:hover{transform:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Underwater game scene" role="img"></canvas>
  <div class="hud">
    <div class="pill">Plankton<b id="score">0</b></div>
    <div class="pill">Best<b id="best">0</b></div>
  </div>
  <div class="veil" id="veil">
    <div class="card">
      <h1 id="title">Drift</h1>
      <p id="msg">You’re a small jellyfish in a big dark sea. Swim up, gather the glowing plankton, and steer clear of the urchins.</p>
      <input class="name" id="name" type="text" maxlength="16" placeholder="Your name" autocomplete="nickname" aria-label="Your name">
      <button class="go" id="go">Start swimming</button>
    </div>
  </div>
</div>
<p class="hint">Tap anywhere on the water (or click, or press space) to pulse upward. Stop tapping and you sink.</p>

<script>
const $ = id => document.getElementById(id);

// ---- ntfy settings: change this topic name to your own ----
const NTFY_TOPIC = "Jellygame";
function notify(title, message){
  try {
    fetch("https://ntfy.sh/" + NTFY_TOPIC, {method: "POST", body: message, headers: {"Title": title, "Tags": "tada"}}).catch(() => {});
  } catch (e) {}
}
const cv = $("c"), ctx = cv.getContext("2d"), stage = $("stage"), veil = $("veil");
let W = 0, H = 0, S = 1, dpr = 1;

function fit(){
  const r = stage.getBoundingClientRect();
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = r.width; H = r.height; S = H / 560;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(fit).observe(stage); fit();

let state = "ready", jy = 280, jv = 0, pulse = 0, t = 0, score = 0, best = 0, spawnT = 40;
let things = [], parts = [];
const bubbles = Array.from({length: 46}, () => ({x: Math.random(), y: Math.random(), r: 1 + Math.random() * 3.5, d: .2 + Math.random() * .8}));
try { best = +localStorage.getItem("drift-best") || 0; } catch (e) {}
function username(){ return ($("name").value.trim() || "Someone").slice(0, 16); }
function saveName(){ try { localStorage.setItem("drift-name", $("name").value.trim()); } catch (e) {} }
try { $("name").value = localStorage.getItem("drift-name") || ""; } catch (e) {}
$("name").addEventListener("keydown", e => { if(e.key === "Enter") start(); });
$("best").textContent = best;

function burst(x, y, color, n){
  for(let i = 0; i < n; i++){
    const a = Math.random() * 6.283, v = (1 + Math.random() * 3) * S;
    parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1, c: color});
  }
}

function swim(){ if(state === "play"){ jv = -6.2 * S; pulse = 1; } }

function start(){
  saveName();
  things = []; parts = []; score = 0; spawnT = 40; jy = H / 2; jv = 0;
  $("score").textContent = 0;
  state = "play"; veil.hidden = true; swim();
}

function end(){
  state = "over";
  burst(H * 0 + W * .25, jy, "#FF7A8A", 36);
  if(score > best){
    best = score; $("best").textContent = best;
    notify("New best in Drift", username() + " just hit " + score + " plankton!");
    try { localStorage.setItem("drift-best", best); } catch (e) {}
  }
  $("title").textContent = "Tangled up";
  $("msg").textContent = "You gathered " + score + " glowing plankton. Your best is " + best + ".";
  $("go").textContent = "Swim again";
  setTimeout(() => { if(state === "over") veil.hidden = false; }, 700);
}

function spawn(){
  if(Math.random() < .7){
    const n = 1 + Math.floor(Math.random() * 3), y = (70 + Math.random() * (H / S - 170)) * S;
    for(let i = 0; i < n; i++) things.push({k: "p", x: W + 20 + i * 30 * S, y: y + Math.sin(i * 1.4) * 14 * S, r: 7 * S});
  } else {
    things.push({k: "u", x: W + 50, y: (60 + Math.random() * (H / S - 140)) * S, r: (18 + Math.random() * 12) * S, ph: Math.random() * 6});
  }
}

function update(dt){
  t += dt; pulse = Math.max(0, pulse - .07 * dt);
  for(const b of bubbles){ b.y -= .0007 * b.d * dt; b.x -= .0002 * b.d * dt; if(b.y < -.02){ b.y = 1.02; b.x = Math.random(); } if(b.x < -.02) b.x = 1.02; }
  for(const p of parts){ p.x += p.vx * dt; p.y += p.vy * dt; p.l -= .025 * dt; }
  parts = parts.filter(p => p.l > 0);
  const jx = W * .25;
  if(state === "ready"){ jy = H / 2 + Math.sin(t / 30) * 12 * S; return; }
  if(state === "over"){ jy = Math.min(jy + 1.2 * S * dt, H - 40 * S); return; }
  jv = Math.min(jv + .28 * S * dt, 7 * S); jy += jv * dt;
  if(jy > H - 36 * S){ jy = H - 36 * S; jv = -2 * S; }
  if(jy < 22 * S){ jy = 22 * S; jv = 0; }
  spawnT -= dt;
  if(spawnT <= 0){ spawn(); spawnT = Math.max(28, 56 - score * .6); }
  const sp = (2.4 + Math.min(score, 50) * .035) * S, jr = 17 * S;
  for(const o of things){
    o.x -= sp * dt;
    const dx = o.x - jx, dy = o.y - jy, d = Math.hypot(dx, dy);
    if(o.k === "p" && d < o.r + jr){
      o.dead = true; score++; $("score").textContent = score; burst(o.x, o.y, "#FFE8A3", 10);
    } else if(o.k === "u" && d < o.r * .85 + jr * .8){
      end(); return;
    }
  }
  things = things.filter(o => !o.dead && o.x > -60);
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  // drifting light
  const g = ctx.createRadialGradient(W * .7, -H * .1, 0, W * .7, -H * .1, H * 1.1);
  g.addColorStop(0, "rgba(160,235,255,.22)"); g.addColorStop(1, "rgba(160,235,255,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // bubbles
  for(const b of bubbles){
    ctx.globalAlpha = .12 + b.d * .25; ctx.fillStyle = "#cdf3ff";
    ctx.beginPath(); ctx.arc(b.x * W, b.y * H, b.r * S * b.d + .6, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // seabed
  ctx.fillStyle = "rgba(2,10,20,.55)";
  ctx.beginPath(); ctx.moveTo(0, H);
  for(let x = 0; x <= W; x += 20) ctx.lineTo(x, H - (10 + 8 * Math.sin(x / 70) + 5 * Math.sin(x / 23)) * S);
  ctx.lineTo(W, H); ctx.fill();
  // things
  for(const o of things){
    if(o.k === "p"){
      const r = o.r * (1 + .15 * Math.sin(t / 8 + o.x));
      const gg = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r * 3.2);
      gg.addColorStop(0, "rgba(255,232,163,.95)"); gg.addColorStop(.35, "rgba(255,232,163,.35)"); gg.addColorStop(1, "rgba(255,232,163,0)");
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(o.x, o.y, r * 3.2, 0, 6.283); ctx.fill();
    } else {
      ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(t / 90 + o.ph);
      ctx.strokeStyle = "#FF7A8A"; ctx.lineWidth = 2.5 * S; ctx.lineCap = "round";
      for(let i = 0; i < 12; i++){
        const a = i * .5236; ctx.beginPath();
        ctx.moveTo(Math.cos(a) * o.r * .8, Math.sin(a) * o.r * .8); ctx.lineTo(Math.cos(a) * o.r * 1.45, Math.sin(a) * o.r * 1.45); ctx.stroke();
      }
      ctx.fillStyle = "#2a1236"; ctx.beginPath(); ctx.arc(0, 0, o.r, 0, 6.283); ctx.fill();
      ctx.strokeStyle = "rgba(255,122,138,.55)"; ctx.lineWidth = 2 * S; ctx.stroke();
      ctx.restore();
    }
  }
  // jellyfish
  if(state !== "over" || parts.length){ drawJelly(); }
  else drawJelly();
  // particles
  for(const p of parts){
    ctx.globalAlpha = Math.max(0, p.l); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.5 * S, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawJelly(){
  const x = W * .25, y = jy, rw = 19 * S * (1 - .14 * pulse), rh = 17 * S * (1 + .22 * pulse);
  ctx.save();
  if(state === "over") ctx.globalAlpha = .55;
  ctx.shadowColor = "rgba(183,156,255,.9)"; ctx.shadowBlur = 26 * S;
  ctx.strokeStyle = "rgba(255,150,200,.8)"; ctx.lineWidth = 2.2 * S; ctx.lineCap = "round";
  for(let i = -2; i <= 2; i++){
    const x0 = x + i * rw / 2.6; ctx.beginPath(); ctx.moveTo(x0, y);
    for(let k = 1; k <= 9; k++) ctx.lineTo(x0 + Math.sin(t * .13 + k * .75 + i) * 5 * S * (k / 9), y + k * (5 + 3 * pulse) * S);
    ctx.stroke();
  }
  const gr = ctx.createRadialGradient(x, y - rh * .4, 2, x, y, rw * 1.3);
  gr.addColorStop(0, "#E4D8FF"); gr.addColorStop(1, "#8F6BFF");
  ctx.fillStyle = gr; ctx.beginPath();
  ctx.moveTo(x - rw, y); ctx.bezierCurveTo(x - rw, y - rh * 1.5, x + rw, y - rh * 1.5, x + rw, y);
  ctx.quadraticCurveTo(x, y + 6 * S, x - rw, y); ctx.fill();
  ctx.restore();
}

let last = performance.now();
function loop(now){
  const dt = Math.min((now - last) / 16.67, 3); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

$("go").addEventListener("click", start);
stage.addEventListener("pointerdown", e => { if(!e.target.closest("button")) swim(); });
addEventListener("keydown", e => {
  if((e.code === "Space" || e.code === "ArrowUp") && state === "play"){ e.preventDefault(); swim(); }
});
</script>
</body>
</html>
